# Defaults that travel with this repo. Overrides for one computer go in
# argus.local.conf (same directory), which is not part of the repo.

ARGUS_SSH_USER=argus
ARGUS_HOST_PREFIX=argus

ARGUS_SSID=argus
ARGUS_PASSWORD=ArmLab19
ARGUS_AP_ADDR=10.42.0.1/24
ARGUS_ETHERNET_ADDR=10.42.1.1/24

# Empty: the Archer T2U Plus (USB 2357:0120) is the access point, and the
# built-in Wi-Fi, if it is a different interface, is the internet uplink.
# The Tenda adapter is used only when the Archer is not plugged in.
ARGUS_AP_IFACE=
ARGUS_UPLINK_IFACE=
ARGUS_UPLINK_SSID=

# dnsmasq writes leases here. Other lease files are still searched.
# On a shared network (the Pis are on ARMLab-5G), those lease addresses are
# left behind. The scripts then scan the network this computer is on and
# match module hostnames from that network's DNS.
ARGUS_LEASE_FILE=/var/lib/misc/dnsmasq.leases
